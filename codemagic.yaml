workflows:
  ios-signed:
    name: iOS Signed Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.27.0
      xcode: latest
      groups:
        - default
    scripts:
      - name: Install dependencies
        script: flutter pub get

      - name: Import code signing
        script: |
          set -e
          # 清理密码
          CLEAN_PASS=$(printf '%s' "$P12_PASSWORD" | tr -d '\n\r ')
          # 解码证书和描述文件
          echo "$P12_CERTIFICATE" | tr -d '\n ' | base64 --decode > /tmp/cert.p12
          echo "$MOBILEPROVISION" | tr -d '\n ' | base64 --decode > /tmp/profile.mobileprovision
          echo "Cert size: $(wc -c < /tmp/cert.p12) bytes"
          # 创建钥匙串
          security create-keychain -p "buildpass123" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "buildpass123" build.keychain
          security list-keychains -d user -s build.keychain
          # 导入证书：先试直接导入，失败则转pem再导入
          security import /tmp/cert.p12 -k build.keychain -P "$CLEAN_PASS" -f pkcs12 -A 2>&1 || {
            echo "Direct import failed, converting to PEM..."
            openssl pkcs12 -in /tmp/cert.p12 -out /tmp/cert.pem -nodes -passin pass:"$CLEAN_PASS"
            security import /tmp/cert.pem -k build.keychain -A
          }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "buildpass123" build.keychain
          # 安装描述文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          security find-identity -v -p codesigning build.keychain

      - name: Build signed iOS
        script: |
          set -e
          flutter build ios --release --no-codesign --config-only
          cd ios
          # 构建时全部跳过签名（包括Pods），最后手动签名
          xcodebuild build \
            -scheme Runner \
            -workspace Runner.xcworkspace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
          cd ..
          APP_PATH="build/ios-derived/Build/Products/Release-iphoneos/Runner.app"
          # 嵌入描述文件
          cp /tmp/profile.mobileprovision "$APP_PATH/embedded.mobileprovision"
          # 禁用 Impeller
          /usr/libexec/PlistBuddy -c "Add :FLTEnableImpeller bool false" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :FLTEnableImpeller false" "$APP_PATH/Info.plist" 2>/dev/null || true
          # 手动签名主应用（递归签名所有framework）
          codesign -f -s "Apple Distribution: Alice Hobler (6M5UL7G6A7)" --deep "$APP_PATH"
          echo "Signed successfully"
          codesign -dv "$APP_PATH" 2>&1 | head -5
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Runner-signed.ipa Payload
          rm -rf Payload
          ls -lh Runner-signed.ipa

      - name: Deploy to GitHub Pages
        script: |
          set -e
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "No GITHUB_TOKEN, skip deploy"
            exit 0
          fi
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d ' ')
          VER_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$VERSION" | cut -d'+' -f2)
          cp Runner-signed.ipa docs/class_schedule.ipa
          printf '{\n  "version": "%s",\n  "build_number": %s,\n  "title": "课程表",\n  "bundle_id": "com.example.classSchedule",\n  "manifest_url": "https://chenhao2000218-ctrl.github.io/class-schedule/manifest.plist",\n  "changelog": "版本更新"\n}\n' "$VER_NAME" "$BUILD_NUM" > docs/version.json
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>items</key>\n  <array>\n    <dict>\n      <key>assets</key>\n      <array>\n        <dict>\n          <key>kind</key>\n          <string>software-package</string>\n          <key>url</key>\n          <string>https://chenhao2000218-ctrl.github.io/class-schedule/class_schedule.ipa</string>\n        </dict>\n      </array>\n      <key>metadata</key>\n      <dict>\n        <key>bundle-identifier</key>\n        <string>com.example.classSchedule</string>\n        <key>bundle-version</key>\n        <string>%s</string>\n        <key>kind</key>\n        <string>software</string>\n        <key>title</key>\n        <string>课程表</string>\n      </dict>\n    </dict>\n  </array>\n</dict>\n</plist>\n' "$VER_NAME" > docs/manifest.plist
          git config user.name "Codemagic Bot"
          git config user.email "bot@codemagic.io"
          git add docs/
          git commit -m "ci: deploy signed v$VER_NAME ($BUILD_NUM)" || echo "No changes"
          git push https://$GITHUB_TOKEN@github.com/chenhao2000218-ctrl/class-schedule.git main
          echo "Deployed!"

    artifacts:
      - Runner-signed.ipa
