workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
      xcode: latest
      vars:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build unsigned iOS
        script: |
          # 强制禁用代码签名
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""

          # Flutter 3.24.0 的 --no-codesign 可以正常构建未签名包
          flutter build ios --release --no-codesign

          # 打包 IPA
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r Runner-unsigned.ipa Payload
            rm -rf Payload
            echo "IPA built successfully: $(pwd)/Runner-unsigned.ipa"
            ls -lh Runner-unsigned.ipa
          else
            echo "ERROR: Runner.app not found at $APP_PATH"
            find build/ios -name "Runner.app" -type d 2>/dev/null || true
            exit 1
          fi
    artifacts:
      - Runner-unsigned.ipa

  android-debug:
    name: Android Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.24.0
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
