name: class_schedule
description: 纯净无广告的大学课程表 App
publish_to: 'none'
version: 1.0.6+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 状态管理
  provider: ^6.1.1
  # 本地存储
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  # 本地通知（上课提醒）
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  # ICS 解析
  icalendar_parser: ^2.0.0
  # 文件选择与读写
  file_picker: ^8.0.0
  # 截图导出分享
  screenshot: ^3.0.0
  image_gallery_saver: ^2.0.3
  share_plus: ^7.2.1
  # 工具
  intl: ^0.19.0
  uuid: ^4.2.1
  # 网络（ICS 链接导入）
  http: ^1.1.0
  # 应用内更新（打开 OTA 安装链接）
  url_launcher: ^6.2.0
  # 传感器（液态玻璃动态光效）
  sensors_plus: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_glass.frag
